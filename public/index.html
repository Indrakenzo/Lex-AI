<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lex-AI Advanced</title>
<style>
  :root {
    --bg-dark: #050505;
    --glass-bg: rgba(15, 20, 30, 0.65);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glow-primary: #00e5ff;
    --glow-secondary: #a855f7;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --shadow-3d: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
  body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }

  /* Animated Background */
  .bg-animation { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; background: radial-gradient(circle at 50% 50%, #1a1025 0%, #050505 100%); overflow: hidden; }
  .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4; animation: float 15s infinite alternate ease-in-out; }
  .orb-1 { width: 300px; height: 300px; background: var(--glow-primary); top: -10%; left: -10%; }
  .orb-2 { width: 400px; height: 400px; background: var(--glow-secondary); bottom: -20%; right: -10%; animation-delay: -5s; }
  @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.2); } }

  /* Header */
  header { padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; background: rgba(5,5,5,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); z-index: 10; }
  .logo { font-size: 20px; font-weight: 800; background: linear-gradient(90deg, var(--glow-primary), var(--glow-secondary)); -webkit-background-clip: text; color: transparent; display: flex; align-items: center; gap: 10px; }
  .logo::before { content: "⚡"; font-size: 24px; }
  .header-actions { display: flex; gap: 10px; }
  .btn { background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-main); padding: 8px 16px; border-radius: 12px; cursor: pointer; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-3d); transition: var(--transition); display: flex; align-items: center; gap: 6px; }
  .btn:hover { background: rgba(255,255,255,0.1); border-color: var(--glow-primary); transform: translateY(-2px); }

  /* Main Layout */
  .layout { display: flex; flex: 1; overflow: hidden; position: relative; }
  
  /* Sidebar */
  .sidebar { width: 320px; background: var(--glass-bg); backdrop-filter: blur(20px); border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; transition: var(--transition); z-index: 5; }
  .sidebar-header { padding: 20px; border-bottom: 1px solid var(--glass-border); font-size: 14px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
  .model-list { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
  .model-item { background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); padding: 12px 15px; border-radius: 12px; cursor: pointer; transition: var(--transition); box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 4px; }
  .model-item:hover { border-color: var(--glow-secondary); transform: translateX(5px); }
  .model-item.active { border-color: var(--glow-primary); background: rgba(0, 229, 255, 0.05); box-shadow: 0 0 20px rgba(0, 229, 255, 0.15), inset 0 1px 1px rgba(255, 255, 255, 0.2); }
  .model-name { font-size: 13px; font-weight: 600; color: var(--text-main); word-break: break-all; }
  .model-provider { font-size: 11px; color: var(--glow-primary); font-weight: 700; }

  /* Chat Area */
  .chat-area { flex: 1; display: flex; flex-direction: column; position: relative; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
  
  .msg-wrapper { display: flex; gap: 15px; max-width: 85%; animation: slideIn 0.3s ease-out; }
  .msg-wrapper.user { align-self: flex-end; flex-direction: row-reverse; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  
  .avatar { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: var(--shadow-3d); flex-shrink: 0; }
  .bot-avatar { background: linear-gradient(135deg, var(--glow-primary), var(--glow-secondary)); }
  .user-avatar { background: linear-gradient(135deg, #f59e0b, #ec4899); }
  
  /* Desain Bot Reply Baru */
  .msg-bubble { padding: 14px 18px; border-radius: 16px; font-size: 14px; line-height: 1.6; box-shadow: var(--shadow-3d); position: relative; }
  .msg-wrapper.bot .msg-bubble { 
    background: rgba(15, 23, 42, 0.7); 
    border: 1px solid var(--glass-border); 
    border-left: 3px solid var(--glow-primary);
    border-top-left-radius: 4px; 
    backdrop-filter: blur(12px); 
    box-shadow: 0 4px 20px rgba(0, 229, 255, 0.1);
  }
  .msg-wrapper.user .msg-bubble { 
    background: linear-gradient(135deg, rgba(0, 229, 255, 0.15), rgba(168, 85, 247, 0.15)); 
    border: 1px solid rgba(0, 229, 255, 0.3); 
    border-top-right-radius: 4px; 
    backdrop-filter: blur(10px); 
  }
  .msg-img-preview { max-width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid var(--glass-border); }
  
  /* Input Area */
  .input-container { padding: 15px 25px; background: linear-gradient(to top, var(--bg-dark) 70%, transparent); }
  .input-box { display: flex; align-items: flex-end; gap: 10px; background: rgba(10, 15, 25, 0.8); border: 1px solid var(--glass-border); padding: 10px 15px; border-radius: 20px; box-shadow: var(--shadow-3d); backdrop-filter: blur(20px); position: relative; transition: var(--transition); }
  .input-box:focus-within { border-color: var(--glow-primary); box-shadow: 0 0 25px rgba(0,229,255,0.2), inset 0 1px 1px rgba(255,255,255,0.1); }
  
  .file-preview-badge { position: absolute; top: -40px; left: 15px; background: var(--glass-bg); padding: 5px 12px; border-radius: 20px; border: 1px solid var(--glow-primary); font-size: 11px; display: none; align-items: center; gap: 8px; box-shadow: var(--shadow-3d); }
  
  textarea { flex: 1; background: transparent; border: none; color: var(--text-main); font-size: 14px; resize: none; max-height: 120px; padding: 10px 0; outline: none; line-height: 1.5; }
  textarea::placeholder { color: var(--text-muted); }
  
  .action-btn { width: 42px; height: 42px; border-radius: 14px; border: none; background: rgba(255,255,255,0.05); color: var(--text-muted); font-size: 18px; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05); }
  .action-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-main); transform: translateY(-2px); }
  .btn-send { background: linear-gradient(135deg, var(--glow-primary), var(--glow-secondary)); color: #fff; box-shadow: 0 5px 15px rgba(0,229,255,0.3); }
  .btn-send:hover { box-shadow: 0 8px 25px rgba(0,229,255,0.5); }
  .mic-active { color: #ef4444; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

  /* Footer */
  .app-footer { display: flex; justify-content: space-between; align-items: center; padding: 12px 25px; background: rgba(5, 5, 5, 0.95); border-top: 1px solid var(--glass-border); z-index: 10; font-size: 12px; color: var(--text-muted); backdrop-filter: blur(10px); }
  .footer-left { font-weight: 600; }
  .footer-right { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .f-row { display: flex; align-items: center; gap: 8px; }
  .f-icon, .f-text { color: var(--text-muted); text-decoration: none; transition: var(--transition); display: flex; align-items: center; }
  .f-icon:hover, .f-text:hover { color: var(--glow-primary); }
  .f-icon svg { fill: currentColor; }
  .f-text { font-weight: 600; }

  @media (max-width: 768px) {
    .sidebar { position: absolute; left: -100%; height: 100%; width: 280px; }
    .sidebar.open { left: 0; }
    .mobile-menu-btn { display: flex; }
    .msg-wrapper { max-width: 95%; }
  }
</style>
</head>
<body>
<div class="bg-animation"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

<header>
  <div class="logo">Lex-AI</div>
  <div class="header-actions">
    <button class="btn" onclick="toggleTTS()" id="ttsBtn" title="Pembaca Suara (TTS)">🔇 Suara Mati</button>
    <button class="btn mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')" style="display:none;">☰ Model</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">Pilih Model AI</div>
    <div class="model-list" id="mList"></div>
  </aside>

  <main class="chat-area">
    <div class="chat-messages" id="msgs"></div>
    
    <div class="input-container">
      <div class="file-preview-badge" id="filePreview">
        <span id="fileName">file.jpg</span>
        <button onclick="clearFile()" style="background:none;border:none;color:white;cursor:pointer">❌</button>
      </div>
      <div class="input-box">
        <input type="file" id="fileInput" accept="image/*,video/*" style="display:none" onchange="handleFile(this)">
        <button class="action-btn" onclick="document.getElementById('fileInput').click()" title="Lampirkan Gambar/Video">📎</button>
        <button class="action-btn" id="micBtn" onclick="toggleMic()" title="Bicara (Input Suara)">🎤</button>
        <textarea id="cinp" placeholder="Ketik pesan atau minta analisis gambar..." rows="1" onkeydown="keyCheck(event)" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';"></textarea>
        <button class="action-btn btn-send" onclick="send()">➤</button>
      </div>
    </div>
  </main>
</div>

<!-- Footer Inyz 2026 -->
<footer class="app-footer">
  <div class="footer-left">
    <span>© 2026 inyz</span>
  </div>
  <div class="footer-right">
    <div class="f-row">
      <a href="https://github.com/Indrakenzo" target="_blank" title="GitHub" class="f-icon">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
      </a>
      <a href="https://indrayaza-z.vercel.app/" target="_blank" class="f-text">Indrakenzo</a>
    </div>
    <div class="f-row">
      <a href="https://pabbura-ai.vercel.app/" target="_blank" class="f-icon" title="Pabbura-AI" style="font-size: 16px;">🩺</a>
      <a href="https://pabbura-ai.vercel.app/" target="_blank" class="f-text">Pabbura-AI</a>
    </div>
  </div>
</footer>

<script>
// --- DAFTAR MODEL (Sesuai List Pasti + Nemotron VL) ---
const MODELS = [
  {id:'gpt-5.5', n:'GPT-5.5', p:'Ai-Router'},
  {id:'gpt-5.2', n:'GPT-5.2', p:'Ai-Router'},
  {id:'codex-mini-latest', n:'Codex Mini', p:'Ai-Router'},
  {id:'nvidia/nemotron-3.5-lightning:free', n:'nvidia/nemotron-3.5-lightning:free', p:'OpenRouter'},
  {id:'openrouter/free', n:'openrouter/free', p:'OpenRouter'},
  {id:'poolside/laguna-s-2.1:free', n:'poolside/laguna-s-2.1:free', p:'OpenRouter'},
  {id:'dots-studio/dots-3-note-preview:free', n:'dots-studio/dots-3-note-preview:free', p:'OpenRouter'},
  {id:'nvidia/nemotron-3-super-120b-a12b:free', n:'nvidia/nemotron-3-super-120b-a12b:free', p:'OpenRouter'},
  {id:'apodex/apodex-1.1-mini:free', n:'apodex/apodex-1.1-mini:free', p:'OpenRouter'},
  {id:'thinkingmachines/inkling:free', n:'thinkingmachines/inkling:free', p:'OpenRouter'},
  {id:'cohere/north-mini-code:free', n:'cohere/north-mini-code:free', p:'OpenRouter'},
  {id:'thinkingmachines/inkling-small:free', n:'thinkingmachines/inkling-small:free', p:'OpenRouter'},
  {id:'poolside/laguna-xs-2.1:free', n:'poolside/laguna-xs-2.1:free', p:'OpenRouter'},
  {id:'nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free', n:'nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free', p:'OpenRouter'},
  {id:'inception/mercury-decide:free', n:'inception/mercury-decide:free', p:'OpenRouter'},
  {id:'liquid/lfm-2.5-2.6b:free', n:'liquid/lfm-2.5-2.6b:free', p:'OpenRouter'},
  {id:'nvidia/llama-nemotron-rerank-vl-1b-v2:free', n:'nvidia/llama-nemotron-rerank-vl-1b-v2:free', p:'OpenRouter'},
  {id:'nvidia/nemotron-3.5-content-safety:free', n:'nvidia/nemotron-3.5-content-safety:free', p:'OpenRouter'},
  {id:'nvidia/nemotron-3-embed-1b:free', n:'nvidia/nemotron-3-embed-1b:free', p:'OpenRouter'},
  {id:'google/gemma-4-26b-a4b-it:free', n:'google/gemma-4-26b-a4b-it:free', p:'OpenRouter'},
  {id:'nvidia/llama-nemotron-embed-vl-1b-v2:free', n:'nvidia/llama-nemotron-embed-vl-1b-v2:free', p:'OpenRouter'},
  {id:'google/gemma-4-31b-it:free', n:'google/gemma-4-31b-it:free', p:'OpenRouter'},
  {id:'respan/span-01-lite:free', n:'respan/span-01-lite:free', p:'OpenRouter'},
  {id:'liquid/lfm-2.5-embedding-350m:free', n:'liquid/lfm-2.5-embedding-350m:free', p:'OpenRouter'},
  {id:'fish-audio/s2.1-pro-free:free', n:'fish-audio/s2.1-pro-free:free', p:'OpenRouter'},
  {id:'nvidia/nemotron-3.5-super-vl:free', n:'nvidia/nemotron-3.5-super-vl:free', p:'OpenRouter'}
];

const S = {
  model: localStorage.getItem('lmm') || 'gpt-5.5',
  provider: localStorage.getItem('lmp') || 'Ai-Router',
  msgs: [], tts: false, attachedFile: null, recognition: null
};

window.onload = () => {
  renderModels();
  if(window.innerWidth <= 768) document.querySelector('.mobile-menu-btn').style.display = 'flex';
  botMsg(`Halo! Saya **Lex-AI**. Saya telah ditingkatkan dengan fitur Multimodal. Anda bisa mengirimkan foto/video dan menggunakan suara. Silakan pilih model di samping kiri.`);
};

function renderModels() {
  const el = document.getElementById('mList');
  el.innerHTML = MODELS.map(m => `
    <div class="model-item ${m.id === S.model ? 'active' : ''}" onclick="pickM('${m.id}','${m.p}')">
      <div class="model-name">${m.n}</div>
      <div class="model-provider">${m.p}</div>
    </div>
  `).join('');
}

function pickM(id, provider) {
  S.model = id; S.provider = provider;
  localStorage.setItem('lmm', id); localStorage.setItem('lmp', provider);
  renderModels();
  if(window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
}

function handleFile(input) {
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    S.attachedFile = e.target.result;
    document.getElementById('filePreview').style.display = 'flex';
    document.getElementById('fileName').textContent = 'Terlampir: ' + file.name;
  };
  reader.readAsDataURL(file);
}
function clearFile() {
  S.attachedFile = null;
  document.getElementById('fileInput').value = '';
  document.getElementById('filePreview').style.display = 'none';
}

function botMsg(txt) {
  const d = document.createElement('div'); d.className = 'msg-wrapper bot';
  d.innerHTML = `<div class="avatar bot-avatar">🤖</div><div class="msg-bubble">${txt.replace(/\n/g,'<br>')}</div>`;
  document.getElementById('msgs').appendChild(d); scrl();
  if(S.tts) speakTTS(txt);
}
function userMsg(txt, imgBase64 = null) {
  const d = document.createElement('div'); d.className = 'msg-wrapper user';
  let imgHtml = imgBase64 ? `<br><img src="${imgBase64}" class="msg-img-preview" />` : '';
  d.innerHTML = `<div class="avatar user-avatar">👤</div><div class="msg-bubble">${txt}${imgHtml}</div>`;
  document.getElementById('msgs').appendChild(d); scrl();
}
function scrl() { const e=document.getElementById('msgs'); e.scrollTop=e.scrollHeight; }

async function send() {
  const inputEl = document.getElementById('cinp');
  const txt = inputEl.value.trim();
  if(!txt && !S.attachedFile) return;
  
  inputEl.value = ''; inputEl.style.height = 'auto';
  userMsg(txt || "Analisis lampiran ini.", S.attachedFile);

  let payloadContent = txt;
  if(S.attachedFile) {
    payloadContent = [
      { type: "text", text: txt || "Tolong jelaskan secara detail." },
      { type: "image_url", image_url: { url: S.attachedFile } }
    ];
  }
  
  S.msgs.push({ role: 'user', content: payloadContent });
  clearFile();
  botMsg("⏳ *Menganalisis...*");

  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ model: S.model, provider: S.provider, messages: S.msgs })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error);
    
    document.getElementById('msgs').lastChild.remove(); 
    
    const reply = data.choices[0].message.content;
    S.msgs.push({ role: 'assistant', content: reply });
    botMsg(reply);
  } catch(e) {
    document.getElementById('msgs').lastChild.remove();
    botMsg(`❌ **Error API:** ${e.message}`);
  }
}
function keyCheck(e) { if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); } }

function toggleTTS() {
  S.tts = !S.tts;
  const btn = document.getElementById('ttsBtn');
  btn.textContent = S.tts ? '🔊 Suara Aktif' : '🔇 Suara Mati';
  btn.style.color = S.tts ? 'var(--glow-primary)' : 'inherit';
}
function speakTTS(text) {
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const cleanText = text.replace(/[*_`#]/g, '');
  const utterance = new SpeechSynthesisUtterance(cleanText);
  utterance.lang = 'id-ID';
  window.speechSynthesis.speak(utterance);
}
function toggleMic() {
  const btn = document.getElementById('micBtn');
  if(S.recognition) { S.recognition.stop(); return; }
  
  if(!('webkitSpeechRecognition' in window)) { alert('Browser tidak mendukung fitur suara.'); return; }
  S.recognition = new webkitSpeechRecognition();
  S.recognition.lang = 'id-ID';
  S.recognition.onstart = () => btn.classList.add('mic-active');
  S.recognition.onresult = (e) => { document.getElementById('cinp').value += e.results[0][0].transcript + ' '; };
  S.recognition.onend = () => { btn.classList.remove('mic-active'); S.recognition = null; };
  S.recognition.start();
}
</script>
</body>
</html>
